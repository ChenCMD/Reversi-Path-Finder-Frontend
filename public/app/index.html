<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reversi Path Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f1e9;
        --bg-accent: #d7e7d0;
        --ink: #1f241e;
        --muted: #5c6458;
        --panel: #ffffff;
        --board: #2f6b4f;
        --board-deep: #25523e;
        --white: #f5f1e8;
        --black: #141614;
        --mask-allowed: #aee6c4;
        --mask-blocked: #c9c5b8;
        --accent: #ef7a3d;
        --accent-2: #3a7ca5;
        --danger: #b33f40;
        --shadow: 0 18px 40px rgba(31, 36, 30, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", Tahoma, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at top, var(--bg-accent), var(--bg));
      }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }

      header h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 0.5px;
      }

      header p {
        margin: 6px 0 0;
        color: var(--muted);
      }

      .panel {
        background: var(--panel);
        border-radius: 18px;
        padding: 20px;
        box-shadow: var(--shadow);
        animation: rise 0.6s ease both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      .grid.two {
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .board {
        display: grid;
        grid-template-columns: repeat(6, 44px);
        grid-template-rows: repeat(6, 44px);
        gap: 4px;
        background: var(--board-deep);
        padding: 10px;
        border-radius: 16px;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08);
      }

      .cell {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--board);
        display: grid;
        place-items: center;
        cursor: pointer;
        position: relative;
        transition: transform 0.12s ease, background 0.2s ease;
      }

      .cell:hover {
        transform: translateY(-1px);
        background: #3a7a59;
      }

      .disk {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        box-shadow: inset 0 -3px 6px rgba(0, 0, 0, 0.4);
      }

      .disk.white {
        background: radial-gradient(circle at 30% 30%, #fffdf4, var(--white));
      }

      .disk.black {
        background: radial-gradient(circle at 30% 30%, #3d423c, var(--black));
      }

      .cell.highlight::after {
        content: "";
        position: absolute;
        inset: 4px;
        border: 2px solid var(--accent);
        border-radius: 8px;
      }

      .mask-cell {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.12s ease, background 0.2s ease;
      }

      .mask-cell.allowed {
        background: var(--mask-allowed);
        color: var(--ink);
      }

      .mask-cell.blocked {
        background: var(--mask-blocked);
        color: #6f6a5e;
      }

      .mask-cell:hover {
        transform: translateY(-1px);
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .section-title h2 {
        margin: 0;
        font-size: 20px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 10px;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
        background: var(--ink);
        color: #fff;
        transition: transform 0.12s ease, box-shadow 0.2s ease;
      }

      button.secondary {
        background: #f2e9dc;
        color: var(--ink);
      }

      button.accent {
        background: var(--accent);
        color: #fff;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 600;
      }

      .status.reachable {
        background: #d5f1df;
        color: #1f5f36;
      }

      .status.unreachable {
        background: #f6d9d9;
        color: #7d2e2f;
      }

      .status.unknown {
        background: #f5e2c8;
        color: #7a4c1f;
      }

      .status.error {
        background: #f6d9d9;
        color: #7d2e2f;
      }

      .octal-list {
        display: grid;
        gap: 8px;
        font-size: 14px;
        margin-top: 12px;
        color: var(--muted);
      }

      .octal-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 12px;
        background: #f7f2ea;
      }

      .octal-item code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
      }

      .stepper {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      input[type="range"] {
        flex: 1;
        min-width: 180px;
      }

      .result-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
      }

      .note {
        color: var(--muted);
        font-size: 14px;
        margin-top: 8px;
      }

      @media (max-width: 720px) {
        .board,
        .mask-cell,
        .cell {
          transform: scale(0.92);
          transform-origin: left top;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>Reversi Path Finder</h1>
          <p>Set a target board and masks, then search for a valid progression.</p>
        </div>
      </header>

      <div id="root"></div>
    </div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
